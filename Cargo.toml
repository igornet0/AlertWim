[package]
name = "alertwim"
version = "0.1.0"
edition = "2021"
description = "AlertWim — a tiny local log/alert window for BoardDo scenarios"
license = "MIT"
repository = "https://github.com/igornet0/AlertWim"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
uuid = { version = "1", features = ["v4"] }

[features]
# Embed `ui/` into the binary so a plain `cargo build --release` gives a
# working app (BoardDo installs it that way, no tauri-cli needed).
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
